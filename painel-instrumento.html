<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil Clínico | PsiReal TCC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FDFAF8;--bg2:#F8F2F4;--bg3:#F2E4D4;
  --surface:#FFFFFF;--border:#E8D8DC;
  --ink:#1E1014;--ink2:#5A3A42;--ink3:#9A7A84;
  --brown:#3D2028;--brown2:#7A4A55;--brown3:#B08090;
  --lilac:#7A4A55;--lilac2:#B08090;--lilac3:#EEE0E4;--lilac4:#F8F2F4;
  --teal:#A0703A;--teal2:#C8956A;--teal3:#E7ECE5;
  --amber:#9E765A;--amber2:#D8B08F;--amber3:#F5E9DD;
  --green:#73856E;--green2:#AAB8A5;--green3:#EDF2EB;
  --coral:#8E4856;--coral3:#FAE8EC;
  --sidebar-w:220px;--radius:10px;--radius-lg:16px;
  --shadow:0 2px 12px rgba(90,48,64,.06),0 1px 3px rgba(90,48,64,.04);
  --shadow-md:0 12px 40px rgba(90,48,64,.12),0 4px 12px rgba(90,48,64,.06);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;min-height:100vh;display:flex}

/* SIDEBAR */
.sidebar{width:var(--sidebar-w);min-height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
.logo{padding:24px 20px 20px;border-bottom:1px solid var(--border)}
.logo-mark{display:flex;align-items:center;gap:10px}
.logo-icon{width:40px;height:40px;border-radius:999px;background:url("logo-psicologia-real.png") center/contain no-repeat;flex:0 0 40px}
.logo-text{font-size:18px;font-weight:600;color:var(--ink);letter-spacing:-.3px;line-height:1.1}
.logo-sub{font-size:10px;color:var(--ink3);letter-spacing:.08em;margin-top:2px}
.nav{padding:16px 12px;flex:1}
.nav-section{margin-bottom:24px}
.nav-label{font-size:9px;font-weight:500;color:var(--ink3);text-transform:uppercase;letter-spacing:.12em;padding:0 8px;margin-bottom:6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius);cursor:pointer;transition:all .15s;color:var(--ink2);font-size:13px;font-weight:400;text-decoration:none}
.nav-item:hover{background:var(--bg2);color:var(--ink)}
.nav-icon{width:18px;height:18px;opacity:.7;flex-shrink:0}
.sidebar-user{padding:16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--lilac),var(--lilac2));display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:500;flex-shrink:0}
.user-name{font-size:12px;font-weight:500;color:var(--ink)}
.user-plan{font-size:10px;color:var(--amber);font-weight:500;letter-spacing:.04em}

/* MAIN */
.main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:14px;position:sticky;top:0;z-index:50}
.topbar-back{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink3);cursor:pointer;text-decoration:none;transition:color .15s;padding:4px 8px;border-radius:var(--radius);border:1px solid var(--border)}
.topbar-back:hover{color:var(--brown);background:var(--bg2)}
.topbar-title{font-size:17px;font-weight:600;color:var(--ink);flex:1}
.content{padding:28px;flex:1}

/* BREADCRUMB */
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);margin-bottom:20px}
.breadcrumb a{color:var(--ink3);text-decoration:none}
.breadcrumb a:hover{color:var(--brown)}
.breadcrumb-sep{opacity:.4}
.breadcrumb-current{color:var(--ink2);font-weight:500}

/* PATIENT HERO */
.patient-hero{display:flex;align-items:center;gap:20px;margin-bottom:28px;padding:24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
.patient-avatar-lg{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--brown),var(--brown3));display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-weight:700;flex-shrink:0}
.patient-info{flex:1}
.patient-name-lg{font-size:22px;font-weight:700;color:var(--brown);margin-bottom:4px}
.patient-meta{font-size:13px;color:var(--ink3);display:flex;gap:16px;flex-wrap:wrap}
.patient-meta span{display:flex;align-items:center;gap:4px}
.patient-stats{display:flex;gap:16px}
.pstat{text-align:center;padding:12px 20px;background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border)}
.pstat-val{font-size:22px;font-weight:800;color:var(--brown);line-height:1}
.pstat-label{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}

/* TABS */
.tabs{display:flex;gap:2px;margin-bottom:24px;background:var(--bg2);padding:4px;border-radius:var(--radius);border:1px solid var(--border);width:fit-content}
.tab{padding:7px 16px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink3);cursor:pointer;transition:all .15s;white-space:nowrap}
.tab.active{background:var(--surface);color:var(--brown);font-weight:600;box-shadow:var(--shadow)}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);margin-bottom:16px}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-title{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.card-body{padding:20px}

/* STATS ROW */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.stat-card.c1::after{background:linear-gradient(90deg,var(--lilac),var(--lilac2))}
.stat-card.c2::after{background:linear-gradient(90deg,var(--teal),var(--teal2))}
.stat-card.c3::after{background:linear-gradient(90deg,var(--amber),var(--amber2))}
.stat-label{font-size:11px;color:var(--ink3);font-weight:500;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.stat-value{font-size:32px;font-weight:800;color:var(--brown);line-height:1;margin-bottom:4px}
.stat-delta{font-size:12px;color:var(--ink3)}
.stat-delta.up{color:var(--green)}
.stat-delta.down{color:var(--coral)}

/* GRID */
.grid-2-1{display:grid;grid-template-columns:1fr 360px;gap:16px;margin-bottom:16px}
.grid-1-1{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}

/* CHART */
.chart-area{width:100%;height:200px;position:relative}

/* LEVEL BADGE */
.level-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.level-minima{background:var(--green3);color:var(--green)}
.level-leve{background:var(--amber3);color:var(--teal)}
.level-moderada{background:var(--coral3);color:var(--coral)}
.level-grave{background:#FAEAEC;color:var(--brown)}

/* HISTORY TABLE */
.hist-table{width:100%;border-collapse:collapse;font-size:13px}
.hist-table th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:0 12px 10px;border-bottom:1px solid var(--border)}
.hist-table td{padding:11px 12px;border-bottom:1px solid var(--border);color:var(--ink2);vertical-align:middle}
.hist-table tr:last-child td{border-bottom:none}
.hist-table tr:hover td{background:var(--bg2)}
.score-pill{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;font-size:13px;font-weight:800;color:#fff}

/* RECO */
.reco-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.reco-item{background:var(--bg2);border-radius:var(--radius);padding:10px 14px;font-size:13px;color:var(--ink2);line-height:1.5;border-left:3px solid var(--border)}

/* GAUGE */
.gauge-wrap{position:relative;height:150px;display:flex;align-items:flex-end;justify-content:center}
.gauge-center{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
.gauge-val{font-size:32px;font-weight:800;color:var(--brown);line-height:1}
.gauge-sub{font-size:11px;color:var(--ink3)}
.scale-bar{display:flex;gap:3px;margin:8px 0 4px}
.scale-seg{flex:1;height:5px;border-radius:99px}
.scale-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--ink3)}

/* INSTRUMENT TABS */
.inst-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.inst-tab{padding:6px 14px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--bg2);color:var(--ink2);transition:all .15s}
.inst-tab.active{background:var(--brown);border-color:var(--brown);color:#fff}
.inst-tab.no-data{opacity:.5;cursor:default}

/* FONTE */
.fonte-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;font-size:11.5px;color:var(--ink3);line-height:1.7}
.fonte-box strong{color:var(--ink2);font-weight:600}

/* EMPTY */
.empty-state{text-align:center;padding:40px 20px;font-size:13px;color:var(--ink3);line-height:1.6}
.empty-state strong{display:block;font-size:15px;color:var(--ink2);margin-bottom:6px}

/* LOADING */
.loading{text-align:center;padding:60px 20px;font-size:13px;color:var(--ink3)}

/* AI */
.ai-warning{background:var(--amber3);border:1px solid var(--amber2);border-radius:var(--radius);padding:14px 16px;font-size:12px;color:var(--ink2);line-height:1.65;margin-bottom:14px}
.ai-warning strong{color:var(--brown2);font-weight:600}
.ai-warning-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
.ai-disclaimer{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;font-size:11px;color:var(--ink3);line-height:1.6;margin-bottom:14px}
.ai-consent-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.ai-consent-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--brown);flex-shrink:0;margin-top:2px;cursor:pointer}
.ai-consent-row label{font-size:12px;color:var(--ink2);line-height:1.6;cursor:pointer}
.ai-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:var(--radius);background:linear-gradient(135deg,var(--brown),var(--brown2));color:#fff;font:600 13px/1 'Inter',sans-serif;border:none;cursor:pointer;transition:all .15s}
.ai-btn:hover:not(:disabled){opacity:.9;transform:translateY(-1px)}
.ai-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.ai-badge{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--bg3);color:var(--teal);border:1px solid var(--amber3);padding:3px 8px;border-radius:4px}
.ai-output{display:none;margin-top:20px;border-top:1px solid var(--border);padding-top:20px}
.ai-output-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brown3);margin-bottom:12px}
.ai-text-wrap{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.ai-text{font-size:13.5px;color:var(--ink2);line-height:1.8;white-space:pre-wrap}
.ai-cursor{display:inline-block;width:2px;height:14px;background:var(--brown3);margin-left:2px;animation:blink .7s step-end infinite;vertical-align:middle}
@keyframes blink{50%{opacity:0}}
.ai-footer{margin-top:12px;font-size:11px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.ai-dot{width:6px;height:6px;border-radius:50%;background:var(--brown3);flex-shrink:0}

@media(max-width:900px){
  body{flex-direction:column}
  .sidebar{position:relative;width:100%;min-height:auto;flex-direction:row;flex-wrap:wrap}
  .main{margin-left:0}
  .grid-2-1,.grid-1-1,.stats-row{grid-template-columns:1fr}
  .patient-hero{flex-direction:column;text-align:center}
  .patient-stats{justify-content:center}
}
</style>

<script>
const SB_URL = 'https://qpwjxacdjzzsyjbuuwsq.supabase.co';
const SB_KEY = 'sb_publishable_hQclCJaEsVjcnGM4WAoYmA_r8H8NqAp';
let SB_SESSION = sessionStorage.getItem('sb_session_token') || '';
const PARAMS = new URLSearchParams(window.location.search);
const INSTRUMENTO = PARAMS.get('instrumento') || 'GAD-7';
const PACIENTE = PARAMS.get('paciente') ? decodeURIComponent(PARAMS.get('paciente')) : null;

// ── INSTRUMENT CONFIGS ───────────────────────────────────────────────────────
const CONFIGS = {
  'GAD-7': {
    title:'GAD-7 — Ansiedade Generalizada', field:'Ansiedade', max:21,
    fonte:'Spitzer RL, Kroenke K, Williams JBW, Löwe B. Arch Intern Med. 2006;166(10):1092–1097. Domínio público (Pfizer Inc., 2010).',
    levels:[
      {min:0,max:4,label:'Mínima',css:'level-minima',color:'#73856E'},
      {min:5,max:9,label:'Leve',css:'level-leve',color:'#A0703A'},
      {min:10,max:14,label:'Moderada',css:'level-moderada',color:'#8E4856'},
      {min:15,max:21,label:'Grave',css:'level-grave',color:'#3D2028'}
    ],
    recos:{
      'Mínima':['Manutenção de autocuidado e regulação emocional.','Continuidade do acompanhamento para consolidar ganhos.','Reaplicação periódica para monitoramento.'],
      'Leve':['Psicoeducação sobre o ciclo da ansiedade.','Identificação de gatilhos e pensamentos precedentes.','Reestruturação cognitiva e ativação comportamental.','Reaplicar em 2 a 4 semanas.'],
      'Moderada':['Avaliação clínica aprofundada e possível encaminhamento psiquiátrico.','Protocolo TCC para TAG: exposição e manejo de preocupações.','Registro de pensamentos e diários entre as sessões.','Discutir suporte farmacológico se indicado.'],
      'Grave':['Avaliação imediata de suporte psiquiátrico.','Plano de crise e protocolo de segurança.','Intensificar frequência das sessões.','Avaliar rede de suporte social e familiar.']
    }
  },
  'PHQ-9': {
    title:'PHQ-9 — Depressão', field:'Depressão', max:27,
    fonte:'Kroenke K, Spitzer RL, Williams JBW. J Gen Intern Med. 2001;16(9):606–613. Domínio público (Pfizer Inc., 2010).',
    levels:[
      {min:0,max:4,label:'Mínima',css:'level-minima',color:'#73856E'},
      {min:5,max:9,label:'Leve',css:'level-leve',color:'#A0703A'},
      {min:10,max:14,label:'Moderada',css:'level-moderada',color:'#8E4856'},
      {min:15,max:19,label:'Moderadamente grave',css:'level-moderada',color:'#7A2A3A'},
      {min:20,max:27,label:'Grave',css:'level-grave',color:'#3D2028'}
    ],
    recos:{
      'Mínima':['Monitoramento periódico.','Manutenção de atividades prazerosas e autocuidado.'],
      'Leve':['Psicoeducação sobre depressão e ciclo de evitação.','Ativação comportamental estruturada.'],
      'Moderada':['Protocolo TCC para depressão.','Avaliar encaminhamento psiquiátrico.'],
      'Moderadamente grave':['Encaminhamento psiquiátrico prioritário.','Plano de segurança preventivo.'],
      'Grave':['Avaliação imediata de risco.','Encaminhamento psiquiátrico urgente.','Plano de crise detalhado.']
    }
  }
};

let CFG = CONFIGS[INSTRUMENTO] || CONFIGS['GAD-7'];
let ALL_RESPONSES = [];
let ACTIVE_INST = INSTRUMENTO;

function levelFor(score, cfg) {
  cfg = cfg || CFG;
  return cfg.levels.find(l => score >= l.min && score <= l.max) || cfg.levels[cfg.levels.length-1];
}

function formatDate(v){ return v ? new Date(v).toLocaleDateString('pt-BR') : '—' }
function formatDateTime(v){ return v ? new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) : '—' }
function initials(name){ return (name||'?').split(' ').filter(Boolean).slice(0,2).map(p=>p[0].toUpperCase()).join('') }

function redirectToLogin(message = 'Sua sessão expirou. Entre novamente para continuar.') {
  sessionStorage.removeItem('sb_session_token');
  sessionStorage.setItem('sb_redirect', window.location.href);
  alert(message);
  window.location.href = 'painel-tcc.html';
}

async function refreshSessionToken() {
  const refreshToken = sessionStorage.getItem('sb_refresh_token');
  if (!refreshToken) return '';
  const res = await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`, {
    method: 'POST',
    headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ refresh_token: refreshToken })
  });
  if (!res.ok) return '';
  const data = await res.json();
  if (!data.access_token) return '';
  SB_SESSION = data.access_token;
  sessionStorage.setItem('sb_session_token', data.access_token);
  if (data.refresh_token) sessionStorage.setItem('sb_refresh_token', data.refresh_token);
  return data.access_token;
}

async function fetchWithTimeout(url, options = {}, timeout = 45000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  try {
    return await fetch(url, { ...options, signal: controller.signal });
  } finally {
    clearTimeout(timer);
  }
}

async function sbFetch(path, useSession=true) {
  const token = useSession ? SB_SESSION : SB_KEY;
  const res = await fetch(`${SB_URL}/rest/v1/${path}`, {
    headers:{apikey:SB_KEY, Authorization:'Bearer '+token}
  });
  if (res.status === 401 && useSession) {
    const refreshed = await refreshSessionToken();
    if (!refreshed) redirectToLogin();
    const retry = await fetch(`${SB_URL}/rest/v1/${path}`, {
      headers:{apikey:SB_KEY, Authorization:'Bearer '+refreshed}
    });
    return retry.ok ? retry.json() : [];
  }
  return res.ok ? res.json() : [];
}

function drawLineChart(canvasId, labels, scores, cfg) {
  cfg = cfg || CFG;
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth || 500;
  const H = canvas.offsetHeight || 200;
  canvas.width = W; canvas.height = H;
  ctx.clearRect(0,0,W,H);
  if (!scores.length) return;
  const pad={top:16,right:16,bottom:32,left:32};
  const w=W-pad.left-pad.right, h=H-pad.top-pad.bottom, max=cfg.max;

  [0,Math.round(max*.25),Math.round(max*.5),Math.round(max*.75),max].forEach(val=>{
    const y=pad.top+h-(val/max)*h;
    ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(pad.left+w,y);
    ctx.strokeStyle='rgba(168,136,152,.15)';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#9A7A84';ctx.font='500 10px Inter,sans-serif';
    ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillText(val,pad.left-4,y);
  });

  cfg.levels.forEach(lv=>{
    const y1=pad.top+h-(lv.max/max)*h, y2=pad.top+h-(lv.min/max)*h;
    ctx.fillStyle=lv.color+'08';ctx.fillRect(pad.left,y1,w,y2-y1);
  });

  const step = w/Math.max(scores.length-1,1);
  labels.forEach((lbl,i)=>{
    ctx.fillStyle='#9A7A84';ctx.font='500 10px Inter,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText(lbl,pad.left+i*step,H-pad.bottom+6);
  });

  if (scores.length===1) {
    const x=pad.left+w/2, y=pad.top+h-(scores[0]/max)*h, lv=levelFor(scores[0],cfg);
    ctx.beginPath();ctx.arc(x,y,5,0,2*Math.PI);ctx.fillStyle=lv.color;ctx.fill();
    return;
  }

  ctx.beginPath();
  scores.forEach((s,i)=>{const x=pad.left+i*step,y=pad.top+h-(s/max)*h; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});
  ctx.strokeStyle='#B08090';ctx.lineWidth=2;ctx.lineJoin='round';ctx.stroke();

  ctx.beginPath();
  scores.forEach((s,i)=>{const x=pad.left+i*step,y=pad.top+h-(s/max)*h; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});
  ctx.lineTo(pad.left+(scores.length-1)*step,pad.top+h);ctx.lineTo(pad.left,pad.top+h);ctx.closePath();
  ctx.fillStyle='rgba(176,128,144,.08)';ctx.fill();

  scores.forEach((s,i)=>{
    const x=pad.left+i*step,y=pad.top+h-(s/max)*h,lv=levelFor(s,cfg);
    ctx.beginPath();ctx.arc(x,y,4,0,2*Math.PI);ctx.fillStyle=lv.color;ctx.fill();
    ctx.beginPath();ctx.arc(x,y,4,0,2*Math.PI);ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
  });
}

function drawGauge(canvasId, score, color, cfg) {
  cfg = cfg || CFG;
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W=canvas.width, H=canvas.height, cx=W/2, cy=H-14;
  const R=Math.min(W,H*1.8)*.46, r=R*.64, total=cfg.max, start=Math.PI;
  ctx.clearRect(0,0,W,H);

  cfg.levels.forEach(lv=>{
    const sa=start+(lv.min/total)*Math.PI, ea=start+((lv.max+1)/total)*Math.PI;
    ctx.beginPath();ctx.arc(cx,cy,R,sa,ea);ctx.arc(cx,cy,r,ea,sa,true);ctx.closePath();
    ctx.fillStyle=lv.color+'22';ctx.fill();ctx.strokeStyle=lv.color+'44';ctx.lineWidth=1;ctx.stroke();
  });

  const na=start+(score/total)*Math.PI;
  ctx.beginPath();ctx.arc(cx,cy,R-3,start,na);ctx.arc(cx,cy,r+3,na,start,true);ctx.closePath();
  ctx.fillStyle=color+'55';ctx.fill();

  const nx=cx+(r-5)*Math.cos(na), ny=cy+(r-5)*Math.sin(na);
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(nx,ny);
  ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.lineCap='round';ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,5,0,2*Math.PI);ctx.fillStyle=color;ctx.fill();

  cfg.levels.map(l=>l.min).concat([cfg.max]).forEach(val=>{
    const a=start+(val/total)*Math.PI;
    ctx.fillStyle='#9A7A84';ctx.font='500 9px Inter,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(val,cx+(R+13)*Math.cos(a),cy+(R+13)*Math.sin(a));
  });
}

// ── AI ANALYSIS ──────────────────────────────────────────────────────────────
async function generateAnalysis() {
  const d = window.__ai_data;
  if (!d) return;
  const btn = document.getElementById('aiBtn');
  const output = document.getElementById('aiOutput');
  const textEl = document.getElementById('aiText');
  btn.disabled=true; btn.textContent='Gerando analise...';
  output.style.display='block';
  textEl.innerHTML='<span class="ai-cursor"></span>';

  const scoreHistory = d.scores.map((s,i)=>`Aplicacao ${i+1}: ${s} pontos`).join('; ');
  const trend = d.scores.length>1?(d.scores[d.scores.length-1]-d.scores[0]<0?'reducao':d.scores[d.scores.length-1]-d.scores[0]>0?'aumento':'estabilidade'):'primeira aplicacao';

  const prompt = `Voce e um assistente clinico especializado em psicologia baseada em evidencias, com dominio em TCC (Terapia Cognitivo-Comportamental), ACT (Acceptance and Commitment Therapy), Terapia do Esquema e DBT (Dialectical Behavior Therapy). Esta analise e exclusiva para uso da psicologa responsavel pelo caso.

Dados do instrumento:
- Instrumento: ${d.inst} (${d.cfg.field})
- Score atual: ${d.latestScore} de ${d.cfg.max} pontos
- Nivel: ${d.latestLevel.label}
- Numero de aplicacoes: ${d.filtered.length}
- Historico: ${scoreHistory}
- Tendencia: ${trend}

Forneca uma analise clinica estruturada em quatro partes:

1. LEITURA CLINICA DO SCORE
Interprete o score atual e sua tendencia no contexto clinico. O que este nivel indica funcionalmente? Quais dominios de vida podem estar mais comprometidos?

2. HIPOTESES DIAGNOSTICAS A INVESTIGAR
Quais transtornos ou padroes clinicos merecem investigacao com base neste score? Considere diagnosticos diferenciais relevantes (ex: TAG, TOC, fobia especifica, TEPT, depressao com ansiedade, esquemas desadaptativos). Seja especifica e tecnica.

3. DIRECIONAMENTO TERAPEUTICO
Quais intervencoes sao prioritarias? Sugira estrategias de TCC, ACT, Terapia do Esquema ou DBT mais indicadas para este perfil. Inclua tecnicas especificas quando pertinente.

4. ALERTAS CLINICOS
Ha sinais de atencao para as proximas sessoes? Quando considerar encaminhamento psiquiatrico?

Escreva de forma tecnica e direta, em paragrafos corridos por secao. Sem marcadores de lista. Sem avisos genericos de "consulte um profissional" pois esta analise ja e para a profissional.`;

  try {
    const payload = {
      instrumento: d.inst,
      score: d.latestScore,
      max: d.cfg.max,
      nivel: d.latestLevel.label,
      aplicacoes: d.filtered.length,
      variacao: d.variation,
      historico: d.scores,
      prompt
    };

    let token = sessionStorage.getItem('sb_session_token') || SB_SESSION;
    if (!token) throw new Error('expired-session');

    let response = await fetchWithTimeout(
      'https://qpwjxacdjzzsyjbuuwsq.supabase.co/functions/v1/smooth-responder',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify(payload)
      }
    );

    if (response.status === 401 || response.status === 403) {
      token = await refreshSessionToken();
      if (!token) throw new Error('expired-session');
      response = await fetchWithTimeout(
        'https://qpwjxacdjzzsyjbuuwsq.supabase.co/functions/v1/smooth-responder',
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify(payload)
        }
      );
    }

    if (!response.ok) throw new Error('ai-request-failed');
    const result = await response.json();
    textEl.innerHTML = '';
    const analysis = result.analysis || result.text || result.content || result.message || '';
    if (analysis) {
      // Render markdown-like formatting
      const html = analysis
        .replace(/^## (.+)$/gm, '<div style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brown2);margin:18px 0 8px">$1</div>')
        .replace(/^# (.+)$/gm, '<div style="font-size:14px;font-weight:700;color:var(--brown);margin:0 0 12px">$1</div>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/\(([a-z]|[0-9])\)/g, '<span style="font-weight:600;color:var(--brown2)">($1)</span>')
        .replace(/\n\n/g, '</p><p style="margin:8px 0">')
        .replace(/\n/g, '<br>');
      textEl.innerHTML = '<p style="margin:0">' + html + '</p>';
    } else {
      textEl.textContent = 'Nao foi possivel gerar a analise. Tente novamente.';
    }
  } catch(error) {
    if (error.message === 'expired-session') {
      textEl.innerHTML = 'Seu login expirou. Volte ao painel, entre novamente e gere a análise outra vez.<br><br><button class="ai-btn" onclick="redirectToLogin()">Voltar para login</button>';
    } else if (error.name === 'AbortError') {
      textEl.textContent = 'A IA demorou demais para responder. Tente novamente em alguns segundos.';
    } else {
      textEl.textContent = 'Erro ao conectar com a IA. Verifique sua conexao e tente novamente.';
    }
  }
  btn.disabled=false; btn.textContent='Gerar nova analise';
}

  const instruments = [...new Set(patientResponses.map(r=>r.instrumento||r.formulario||'').filter(Boolean))];

  document.getElementById('topbarTitle').textContent = PACIENTE || 'Perfil Clínico';

  const content = document.getElementById('mainContent');

  if (!PACIENTE) {
    content.innerHTML = `<div class="card"><div class="card-body"><div class="empty-state"><strong>Paciente nao identificado</strong>Acesse este painel a partir do perfil de um paciente.</div></div></div>`;
    return;
  }

  const availableInst = Object.keys(CONFIGS).filter(k=>instruments.some(i=>i.toUpperCase().includes(k.replace('-',''))||i===k));

  content.innerHTML = `
    <div class="breadcrumb">
      <a href="painel-tcc.html">Dashboard</a>
      <span class="breadcrumb-sep">/</span>

          <span>${totalApps} resposta(s) registrada(s)</span>

        </div>

        <div class="pstat">
          <div class="pstat-val">${totalApps}</div>
          <div class="pstat-label">Respostas</div>
        </div>
        <div class="pstat">
          <div class="pstat-val">${availableInst.length}</div>
          <div class="pstat-label">Instrumentos</div>
        </div>

function switchInst(inst) {
  ACTIVE_INST = inst;
  CFG = CONFIGS[inst] || CFG;
  document.querySelectorAll('.inst-tab').forEach(t=>{
    t.classList.toggle('active', t.textContent.trim().startsWith(inst));
  });
  renderInstrument(inst, window.__all_responses || []);
}
