<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #FDFAF8;
  --bg2:       #F8F2F4;
  --bg3:       #F2E4D4;
  --surface:   #FFFFFF;
  --border:    #E8D8DC;
  --ink:       #1E1014;
  --ink2:      #5A3A42;
  --ink3:      #9A7A84;
  --brown:     #3D2028;
  --brown2:    #7A4A55;
  --brown3:    #B08090;
  --lilac:     #7A4A55;
  --lilac2:    #B08090;
  --lilac3:    #EEE0E4;
  --lilac4:    #F8F2F4;
  --teal:      #A0703A;
  --teal2:     #C8956A;
  --teal3:     #E7ECE5;
  --amber:     #9E765A;
  --amber2:    #D8B08F;
  --amber3:    #F5E9DD;
  --green:     #73856E;
  --green2:    #AAB8A5;
  --green3:    #EDF2EB;
  --sidebar-w: 220px;
  --radius:    10px;
  --radius-lg: 16px;
  --shadow:    0 2px 12px rgba(90,48,64,.06), 0 1px 3px rgba(90,48,64,.04);
  --shadow-md: 0 12px 40px rgba(90,48,64,.12), 0 4px 12px rgba(90,48,64,.06);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.55;
  min-height: 100vh;
  display: flex;
}

/* SIDEBAR */
.sidebar {
  width: var(--sidebar-w);
  min-height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
}
.logo { padding: 24px 20px 20px; border-bottom: 1px solid var(--border); }
.logo-mark { display: flex; align-items: center; gap: 10px; }
.logo-icon { width: 40px; height: 40px; border-radius: 999px; background: url("logo-psicologia-real.png") center / contain no-repeat; flex: 0 0 40px; }
.logo-text { font-size: 18px; font-weight: 600; color: var(--ink); letter-spacing: -0.3px; line-height: 1.1; }
.logo-sub { font-size: 10px; color: var(--ink3); letter-spacing: .08em; margin-top: 2px; }
.nav { padding: 16px 12px; flex: 1; }
.nav-section { margin-bottom: 24px; }
.nav-label { font-size: 9px; font-weight: 500; color: var(--ink3); text-transform: uppercase; letter-spacing: .12em; padding: 0 8px; margin-bottom: 6px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--radius);
  cursor: pointer; transition: all .15s;
  color: var(--ink2); font-size: 13px; font-weight: 400;
  text-decoration: none; position: relative;
}
.nav-item:hover { background: var(--bg2); color: var(--ink); }
.nav-icon { width: 18px; height: 18px; opacity: .7; flex-shrink: 0; }
.sidebar-user {
  padding: 16px; border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, var(--lilac), var(--lilac2));
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: #fff; font-weight: 500; flex-shrink: 0;
}
.user-name { font-size: 12px; font-weight: 500; color: var(--ink); }
.user-plan { font-size: 10px; color: var(--amber); font-weight: 500; letter-spacing: .04em; }

/* MAIN */
.main { margin-left: var(--sidebar-w); flex: 1; min-height: 100vh; display: flex; flex-direction: column; }

/* TOPBAR */
.topbar {
  height: 56px; background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 28px; gap: 16px;
  position: sticky; top: 0; z-index: 50;
}
.topbar-back {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--ink3); cursor: pointer;
  text-decoration: none; transition: color .15s;
  padding: 4px 8px; border-radius: var(--radius);
  border: 1px solid var(--border);
}
.topbar-back:hover { color: var(--brown); background: var(--bg2); }
.topbar-title { font-size: 18px; font-weight: 600; color: var(--ink); flex: 1; }
.topbar-meta { font-size: 12px; color: var(--ink3); }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: var(--radius);
  font-size: 12px; font-weight: 500; cursor: pointer;
  border: none; transition: all .15s;
  font-family: inherit;
}
.btn-primary { background: linear-gradient(135deg, var(--brown), var(--brown2)); color: #fff; }
.btn-primary:hover { opacity: .92; }
.btn-ghost { background: transparent; color: var(--ink2); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--bg2); }

/* CONTENT */
.content { padding: 28px; flex: 1; }

/* BREADCRUMB */
.breadcrumb {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--ink3);
  margin-bottom: 20px;
}
.breadcrumb a { color: var(--ink3); text-decoration: none; }
.breadcrumb a:hover { color: var(--brown); }
.breadcrumb-sep { opacity: .4; }
.breadcrumb-current { color: var(--ink2); font-weight: 500; }

/* HEADER ROW */
.page-header { margin-bottom: 24px; }
.page-kicker { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--brown3); margin-bottom: 6px; }
.page-title { font-size: 26px; font-weight: 700; color: var(--brown); line-height: 1.2; margin-bottom: 4px; }
.page-sub { font-size: 13px; color: var(--ink3); }

/* STAT CARDS */
.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 18px 20px;
  position: relative; overflow: hidden;
}
.stat-card::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
}
.stat-card.c1::after { background: linear-gradient(90deg, var(--lilac), var(--lilac2)); }
.stat-card.c2::after { background: linear-gradient(90deg, var(--teal), var(--teal2)); }
.stat-card.c3::after { background: linear-gradient(90deg, var(--amber), var(--amber2)); }
.stat-label { font-size: 11px; color: var(--ink3); font-weight: 500; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
.stat-value { font-size: 32px; font-weight: 800; color: var(--brown); line-height: 1; margin-bottom: 4px; }
.stat-delta { font-size: 12px; color: var(--ink3); }
.stat-delta.up { color: var(--green); }
.stat-delta.down { color: var(--coral); }

/* GRID */
.grid-2-1 { display: grid; grid-template-columns: 1fr 380px; gap: 20px; margin-bottom: 20px; }
.grid-1-1 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }

/* CARDS */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow);
}
.card-header {
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.card-title { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink3); }
.card-body { padding: 20px; }

/* CHART */
.chart-area {
  width: 100%; height: 200px;
  position: relative;
}
canvas.line-chart { width: 100% !important; height: 100% !important; }

/* LEVEL BADGE */
.level-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 99px;
  font-size: 11px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase;
}
.level-minima  { background: var(--green3);  color: var(--green); }
.level-leve    { background: var(--amber3);  color: var(--teal); }
.level-moderada{ background: var(--coral3);  color: var(--coral); }
.level-grave   { background: #FAEAEC;        color: var(--brown); }

/* HISTORY TABLE */
.hist-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.hist-table th {
  text-align: left; font-size: 10px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; color: var(--ink3);
  padding: 0 12px 10px; border-bottom: 1px solid var(--border);
}
.hist-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); color: var(--ink2); vertical-align: middle; }
.hist-table tr:last-child td { border-bottom: none; }
.hist-table tr:hover td { background: var(--bg2); }
.score-pill {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 50%;
  font-size: 13px; font-weight: 800; color: #fff;
}

/* RECOS */
.reco-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.reco-item {
  background: var(--bg2); border-radius: var(--radius);
  padding: 10px 14px; font-size: 13px; color: var(--ink2);
  line-height: 1.5; border-left: 3px solid var(--border);
}

/* FONTE */
.fonte-box {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
  font-size: 11.5px; color: var(--ink3); line-height: 1.7;
}
.fonte-box strong { color: var(--ink2); font-weight: 600; }

/* EMPTY */
.empty-state {
  text-align: center; padding: 40px 20px;
  font-size: 13px; color: var(--ink3); line-height: 1.6;
}
.empty-state strong { display: block; font-size: 15px; color: var(--ink2); margin-bottom: 6px; }

/* LOADING */
.loading { text-align: center; padding: 60px 20px; font-size: 13px; color: var(--ink3); }

/* ABOUT BOX */
.about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.about-col { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.about-col-label { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--brown2); margin-bottom: 8px; }
.about-col ul { list-style: none; display: flex; flex-direction: column; gap: 5px; }
.about-col ul li { font-size: 12px; color: var(--ink2); line-height: 1.45; padding-left: 14px; position: relative; }
.about-col ul li::before { content: '–'; position: absolute; left: 0; color: var(--brown3); }

/* GAUGE */
.gauge-wrap { position: relative; height: 150px; display: flex; align-items: flex-end; justify-content: center; }
.gauge-center { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; }
.gauge-val { font-size: 32px; font-weight: 800; color: var(--brown); line-height: 1; }
.gauge-sub { font-size: 11px; color: var(--ink3); }
.scale-bar { display: flex; gap: 3px; margin: 8px 0 4px; }
.scale-seg { flex: 1; height: 5px; border-radius: 99px; }
.scale-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink3); }

@media (max-width: 900px) {
  body { flex-direction: column; }
  .sidebar { position: relative; width: 100%; min-height: auto; flex-direction: row; flex-wrap: wrap; }
  .main { margin-left: 0; }
  .grid-2-1, .grid-1-1, .stats-row { grid-template-columns: 1fr; }
}
</style>

<script>
const SB_URL = 'https://qpwjxacdjzzsyjbuuwsq.supabase.co';
const SB_KEY = 'sb_publishable_hQclCJaEsVjcnGM4WAoYmA_r8H8NqAp';
const SB_SESSION_TOKEN = sessionStorage.getItem('sb_session_token') || '';

const PARAMS = new URLSearchParams(window.location.search);
const INSTRUMENTO = PARAMS.get('instrumento') || 'GAD-7';
const PACIENTE = PARAMS.get('paciente') ? decodeURIComponent(PARAMS.get('paciente')) : null;

// ── CONFIG PER INSTRUMENT ────────────────────────────────────────────────────
const CONFIGS = {
  'GAD-7': {
    title: 'GAD-7 — Ansiedade Generalizada',
    kicker: 'GAD-7 · Faixa 0–21',
    max: 21,
    field: 'Ansiedade',
    levels: [
      { min:0,  max:4,  label:'Mínima',   css:'level-minima',   color:'#73856E' },
      { min:5,  max:9,  label:'Leve',     css:'level-leve',     color:'#A0703A' },
      { min:10, max:14, label:'Moderada', css:'level-moderada', color:'#8E4856' },
      { min:15, max:21, label:'Grave',    css:'level-grave',    color:'#3D2028' }
    ],
    recos: {
      'Mínima':   ['Manutenção de práticas de autocuidado e regulação emocional.','Continuidade do acompanhamento terapêutico para consolidar os ganhos.','Reaplicação periódica para monitoramento longitudinal.'],
      'Leve':     ['Psicoeducação sobre o ciclo da ansiedade e estratégias de regulação.','Identificação de situações e pensamentos que precedem os sintomas.','Reestruturação cognitiva e ativação comportamental.','Reaplicar em 2 a 4 semanas.'],
      'Moderada': ['Avaliação clínica aprofundada e possível encaminhamento psiquiátrico.','Protocolo estruturado de TCC para TAG: exposição e manejo de preocupações.','Registro de pensamentos e diários entre as sessões.','Discutir suporte farmacológico adjunto, se indicado.'],
      'Grave':    ['Avaliação imediata da necessidade de suporte psiquiátrico e/ou medicação.','Plano de crise e protocolo de segurança.','Intensificação da frequência das sessões terapêuticas, se viável.','Avaliação da rede de suporte social e familiar.']
    },
    about: {
      is: ['Escala validada de rastreio e monitoramento de sintomas de TAG','Apoio ao julgamento clínico da psicóloga','Recurso para acompanhar a evolução ao longo das sessões','Reconhecida globalmente: NHS, OMS, VA'],
      not: ['Um diagnóstico psicológico ou psiquiátrico','Substituto da avaliação clínica especializada','Ferramenta de autodiagnóstico','Indicativo isolado de qualquer transtorno']
    },
    fonte: 'Spitzer RL, Kroenke K, Williams JBW, Löwe B. A brief measure for assessing generalized anxiety disorder: the GAD-7. <em>Arch Intern Med.</em> 2006;166(10):1092–1097. Domínio público desde 2010 (Pfizer Inc.). Disponível em: phqscreeners.com'
  },
  'PHQ-9': {
    title: 'PHQ-9 — Depressão',
    kicker: 'PHQ-9 · Faixa 0–27',
    max: 27,
    field: 'Depressão',
    levels: [
      { min:0,  max:4,  label:'Mínima',              css:'level-minima',   color:'#73856E' },
      { min:5,  max:9,  label:'Leve',                css:'level-leve',     color:'#A0703A' },
      { min:10, max:14, label:'Moderada',             css:'level-moderada', color:'#8E4856' },
      { min:15, max:19, label:'Moderadamente grave',  css:'level-moderada', color:'#7A2A3A' },
      { min:20, max:27, label:'Grave',                css:'level-grave',    color:'#3D2028' }
    ],
    recos: {
      'Mínima':             ['Monitoramento periódico.','Manutenção de atividades prazerosas e autocuidado.'],
      'Leve':               ['Psicoeducação sobre depressão e ciclo de evitação.','Ativação comportamental estruturada.','Identificação de pensamentos disfuncionais.'],
      'Moderada':           ['Protocolo TCC para depressão.','Avaliar encaminhamento psiquiátrico.','Reestruturação cognitiva e experimentos comportamentais.'],
      'Moderadamente grave':['Encaminhamento psiquiátrico prioritário.','Plano de segurança preventivo.','Intensificação das sessões.'],
      'Grave':              ['Avaliação imediata de risco.','Encaminhamento psiquiátrico urgente.','Plano de crise detalhado.','Avaliar internação se necessário.']
    },
    about: {
      is: ['Escala validada de rastreio e severidade de sintomas depressivos','Apoio ao julgamento clínico da psicóloga','Sensível a mudanças ao longo do tratamento'],
      not: ['Um diagnóstico psicológico ou psiquiátrico','Substituto da avaliação clínica especializada','Ferramenta de autodiagnóstico']
    },
    fonte: 'Kroenke K, Spitzer RL, Williams JBW. The PHQ-9: validity of a brief depression severity measure. <em>J Gen Intern Med.</em> 2001;16(9):606–613. Domínio público desde 2010 (Pfizer Inc.). Disponível em: phqscreeners.com'
  }
};

const CFG = CONFIGS[INSTRUMENTO] || CONFIGS['GAD-7'];

// ── HELPERS ──────────────────────────────────────────────────────────────────
function levelFor(score) {
  return CFG.levels.find(l => score >= l.min && score <= l.max) || CFG.levels[CFG.levels.length - 1];
}

function formatDate(val) {
  if (!val) return '—';
  return new Date(val).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function formatDateTime(val) {
  if (!val) return '—';
  return new Date(val).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
}

async function sbFetch(path) {
  const res = await fetch(`${SB_URL}/rest/v1/${path}`, {
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_SESSION_TOKEN }
  });
  return res.ok ? res.json() : [];
}

// ── CHART ────────────────────────────────────────────────────────────────────
function drawLineChart(canvasId, labels, scores) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth || canvas.width;
  const H = canvas.offsetHeight || canvas.height;
  canvas.width = W; canvas.height = H;
  ctx.clearRect(0, 0, W, H);

  if (!scores.length) return;

  const pad = { top: 16, right: 16, bottom: 32, left: 32 };
  const w = W - pad.left - pad.right;
  const h = H - pad.top - pad.bottom;
  const max = CFG.max;

  // Grid lines + Y labels
  [0, Math.round(max * 0.25), Math.round(max * 0.5), Math.round(max * 0.75), max].forEach(val => {
    const y = pad.top + h - (val / max) * h;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(pad.left + w, y);
    ctx.strokeStyle = 'rgba(168,136,152,.15)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#9A7A84';
    ctx.font = '500 10px Inter,sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(val, pad.left - 4, y);
  });

  // Level bands (subtle)
  CFG.levels.forEach(lv => {
    const y1 = pad.top + h - (lv.max / max) * h;
    const y2 = pad.top + h - (lv.min / max) * h;
    ctx.fillStyle = lv.color + '08';
    ctx.fillRect(pad.left, y1, w, y2 - y1);
  });

  // X labels
  const step = w / Math.max(scores.length - 1, 1);
  labels.forEach((lbl, i) => {
    const x = pad.left + i * step;
    ctx.fillStyle = '#9A7A84';
    ctx.font = '500 10px Inter,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(lbl, x, H - pad.bottom + 6);
  });

  if (scores.length === 1) {
    // Single point — just a dot
    const x = pad.left + w / 2;
    const y = pad.top + h - (scores[0] / max) * h;
    const lv = levelFor(scores[0]);
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, 2 * Math.PI);
    ctx.fillStyle = lv.color;
    ctx.fill();
    return;
  }

  // Line
  ctx.beginPath();
  scores.forEach((score, i) => {
    const x = pad.left + i * step;
    const y = pad.top + h - (score / max) * h;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#B08090';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Area fill
  ctx.beginPath();
  scores.forEach((score, i) => {
    const x = pad.left + i * step;
    const y = pad.top + h - (score / max) * h;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.lineTo(pad.left + (scores.length - 1) * step, pad.top + h);
  ctx.lineTo(pad.left, pad.top + h);
  ctx.closePath();
  ctx.fillStyle = 'rgba(176,128,144,.08)';
  ctx.fill();

  // Dots
  scores.forEach((score, i) => {
    const x = pad.left + i * step;
    const y = pad.top + h - (score / max) * h;
    const lv = levelFor(score);
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, 2 * Math.PI);
    ctx.fillStyle = lv.color;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, 2 * Math.PI);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });
}

// ── GAUGE ────────────────────────────────────────────────────────────────────
function drawGauge(canvasId, score, color) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H - 14;
  const R = Math.min(W, H * 1.8) * 0.46;
  const r = R * 0.64;
  const total = CFG.max, start = Math.PI;

  ctx.clearRect(0, 0, W, H);

  CFG.levels.forEach(lv => {
    const sa = start + (lv.min / total) * Math.PI;
    const ea = start + ((lv.max + 1) / total) * Math.PI;
    ctx.beginPath();
    ctx.arc(cx, cy, R, sa, ea);
    ctx.arc(cx, cy, r, ea, sa, true);
    ctx.closePath();
    ctx.fillStyle = lv.color + '22';
    ctx.fill();
    ctx.strokeStyle = lv.color + '44';
    ctx.lineWidth = 1;
    ctx.stroke();
  });

  const na = start + (score / total) * Math.PI;
  ctx.beginPath();
  ctx.arc(cx, cy, R - 3, start, na);
  ctx.arc(cx, cy, r + 3, na, start, true);
  ctx.closePath();
  ctx.fillStyle = color + '55';
  ctx.fill();

  const nx = cx + (r - 5) * Math.cos(na);
  const ny = cy + (r - 5) * Math.sin(na);
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(nx, ny);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, 5, 0, 2 * Math.PI);
  ctx.fillStyle = color;
  ctx.fill();

  const ticks = CFG.levels.map(l => l.min).concat([CFG.max]);
  ticks.forEach(val => {
    const a = start + (val / total) * Math.PI;
    ctx.fillStyle = '#9A7A84';
    ctx.font = '500 9px Inter,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(val, cx + (R + 13) * Math.cos(a), cy + (R + 13) * Math.sin(a));
  });
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function render(responses) {
  // Filter by instrument (and optionally by patient)
  let filtered = responses.filter(r => {
    const inst = (r.instrumento || r.formulario || '').toUpperCase().replace(/\s/g,'');
    const key  = INSTRUMENTO.toUpperCase().replace(/\s/g,'');
    return inst === key || inst.includes(key.replace('-',''));
  });
  if (PACIENTE) filtered = filtered.filter(r => r.paciente_nome === PACIENTE);
  filtered = filtered.sort((a,b) => new Date(a.created_at) - new Date(b.created_at));

  const content = document.getElementById('mainContent');

  // topbar
  document.getElementById('topbarTitle').textContent = PACIENTE
    ? `${CFG.field} — ${PACIENTE}`
    : `${CFG.field} — Todas as pacientes`;
  document.getElementById('topbarMeta').textContent = PACIENTE
    ? `${filtered.length} aplicação(ões)` : '';

  if (!filtered.length) {
    content.innerHTML = `
      <div class="breadcrumb">
        <a href="painel-tcc.html">Dashboard</a>
        <span class="breadcrumb-sep">/</span>
        <span class="breadcrumb-current">${CFG.title}</span>
      </div>
      <div class="page-header">
        <div class="page-kicker">${CFG.kicker}</div>
        <div class="page-title">Dashboard de ${CFG.field}</div>
      </div>
      <div class="card">
        <div class="card-body">
          <div class="empty-state">
            <strong>Nenhuma resposta registrada</strong>
            ${PACIENTE ? `Ainda não há respostas do ${INSTRUMENTO} para ${PACIENTE}.` : `Nenhuma resposta do ${INSTRUMENTO} recebida ainda.`}
            <br><br>
            <a href="painel-tcc.html" class="btn btn-primary" style="display:inline-flex;margin-top:4px">Ir para o painel</a>
          </div>
        </div>
      </div>`;
    return;
  }

  const latest = filtered[filtered.length - 1];
  const latestScore = Number(latest.score_total ?? latest.scores?.total ?? 0);
  const latestLevel = levelFor(latestScore);
  const firstScore = Number(filtered[0].score_total ?? filtered[0].scores?.total ?? 0);
  const variation = latestScore - firstScore;
  const recos = CFG.recos[latestLevel.label] || [];

  const scores  = filtered.map(r => Number(r.score_total ?? r.scores?.total ?? 0));
  const labels  = filtered.map(r => formatDate(r.created_at));

  const scaleSegs = CFG.levels.map(lv =>
    `<div class="scale-seg" style="background:${lv.color};flex:${lv.max - lv.min + 1}"></div>`
  ).join('');
  const scaleLabels = CFG.levels.map(lv =>
    `<span>${lv.min} ${lv.label}</span>`
  ).join('') + `<span>${CFG.max}</span>`;

  content.innerHTML = `
    <div class="breadcrumb">
      <a href="painel-tcc.html">Dashboard</a>
      <span class="breadcrumb-sep">/</span>
      ${PACIENTE ? `<a href="painel-tcc.html">Pacientes</a><span class="breadcrumb-sep">/</span>` : ''}
      <span class="breadcrumb-current">${CFG.title}${PACIENTE ? ' — ' + PACIENTE : ''}</span>
    </div>

    <div class="page-header">
      <div class="page-kicker">${CFG.kicker}</div>
      <div class="page-title">Dashboard de ${CFG.field}${PACIENTE ? '<span style="font-weight:400;color:var(--ink3)"> — ' + PACIENTE + '</span>' : ''}</div>
      <div class="page-sub">Acompanhamento longitudinal de sintomas via ${INSTRUMENTO}</div>
    </div>

    <!-- STATS -->
    <div class="stats-row">
      <div class="stat-card c1">
        <div class="stat-label">Ultimo score</div>
        <div class="stat-value" style="color:${latestLevel.color}">${latestScore}</div>
        <div class="stat-delta">de ${CFG.max} pontos · ${formatDate(latest.created_at)}</div>
      </div>
      <div class="stat-card c2">
        <div class="stat-label">Aplicacoes recebidas</div>
        <div class="stat-value">${filtered.length}</div>
        <div class="stat-delta">${filtered.length > 1 ? 'historico disponivel' : 'primeira aplicacao'}</div>
      </div>
      <div class="stat-card c3">
        <div class="stat-label">Variacao desde a primeira</div>
        <div class="stat-value ${variation < 0 ? 'up' : variation > 0 ? 'down' : ''}">${variation > 0 ? '+' : ''}${variation}</div>
        <div class="stat-delta ${variation < 0 ? 'up' : variation > 0 ? 'down' : ''}">${variation < 0 ? 'reducao de sintomas' : variation > 0 ? 'aumento de sintomas' : 'sem variacao'}</div>
      </div>
    </div>

    <!-- CHART + GAUGE -->
    <div class="grid-2-1">
      <div class="card">
        <div class="card-header">
          <div class="card-title">Evolucao Longitudinal</div>
          <span class="level-badge ${latestLevel.css}">${latestLevel.label}</span>
        </div>
        <div class="card-body">
          <div class="chart-area">
            <canvas id="lineChart" style="width:100%;height:200px"></canvas>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">Score Atual</div>
        </div>
        <div class="card-body">
          <div class="gauge-wrap">
            <canvas id="gaugeChart" width="240" height="130"></canvas>
            <div class="gauge-center">
              <div class="gauge-val" style="color:${latestLevel.color}">${latestScore}</div>
              <div class="gauge-sub">de ${CFG.max} pts</div>
            </div>
          </div>
          <div class="scale-bar">${scaleSegs}</div>
          <div class="scale-labels">${scaleLabels}</div>
        </div>
      </div>
    </div>

    <!-- HISTORY + RECOS -->
    <div class="grid-1-1">
      <div class="card">
        <div class="card-header"><div class="card-title">Historico Recente</div></div>
        <div class="card-body" style="padding:0">
          <table class="hist-table">
            <thead><tr>
              <th>Paciente</th>
              <th>Data</th>
              <th>Score</th>
              <th>Nivel</th>
            </tr></thead>
            <tbody>
              ${[...filtered].reverse().slice(0, 8).map(r => {
                const s = Number(r.score_total ?? r.scores?.total ?? 0);
                const lv = levelFor(s);
                return `<tr>
                  <td style="font-weight:500;color:var(--ink)">${r.paciente_nome || '—'}</td>
                  <td>${formatDate(r.created_at)}</td>
                  <td><span class="score-pill" style="background:${lv.color}">${s}</span></td>
                  <td><span class="level-badge ${lv.css}" style="font-size:10px">${lv.label}</span></td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">Orientacoes Clinicas — ${latestLevel.label}</div>
        </div>
        <div class="card-body">
          <ul class="reco-list">
            ${recos.map(r => `<li class="reco-item" style="border-left-color:${latestLevel.color}">${r}</li>`).join('')}
          </ul>
        </div>
      </div>
    </div>

    <!-- ABOUT + FONTE -->
    <div class="grid-1-1">
      <div class="card">
        <div class="card-header"><div class="card-title">Sobre este instrumento</div></div>
        <div class="card-body">
          <div class="about-grid">
            <div class="about-col">
              <div class="about-col-label">Este instrumento e</div>
              <ul>${CFG.about.is.map(t => `<li>${t}</li>`).join('')}</ul>
            </div>
            <div class="about-col">
              <div class="about-col-label">Este instrumento nao e</div>
              <ul>${CFG.about.not.map(t => `<li>${t}</li>`).join('')}</ul>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><div class="card-title">Fonte e Licenca</div></div>
        <div class="card-body">
          <div class="fonte-box">${CFG.fonte}</div>
        </div>
      </div>
    </div>
  `;

  // Draw charts after DOM is ready
  requestAnimationFrame(() => {
    const lineCanvas = document.getElementById('lineChart');
    if (lineCanvas) {
      lineCanvas.width = lineCanvas.offsetWidth;
      lineCanvas.height = lineCanvas.offsetHeight || 200;
      drawLineChart('lineChart', labels, scores);
    }
    drawGauge('gaugeChart', latestScore, latestLevel.color);
  });
}

// ── INIT ─────────────────────────────────────────────────────────────────────
async function init() {
  // Auth check
  if (!SB_SESSION_TOKEN) {
    sessionStorage.setItem('sb_redirect', window.location.href);
    window.location.href = 'painel-tcc.html';
    return;
  }

  // Load psi identity
  try {
    const psi = await sbFetch('psis?select=nome,plano,ativa&limit=1');
    if (psi?.[0]) {
      const name = psi[0].nome || 'Psicóloga';
      document.getElementById('sidebarName').textContent = name;
      document.getElementById('sidebarPlan').textContent = psi[0].plano || 'Plano ativo';
      document.getElementById('sidebarAvatar').textContent =
        name.split(' ').filter(Boolean).slice(0,2).map(p => p[0].toUpperCase()).join('');
    }
  } catch (_) {}

  // Load responses
  try {
    const responses = await sbFetch(
      'respostas_clinicas?select=id,paciente_nome,instrumento,formulario,score_total,scores,status,created_at&order=created_at.desc'
    );
    render(responses || []);
  } catch (_) {
    document.getElementById('mainContent').innerHTML = `
      <div class="card"><div class="card-body">
        <div class="empty-state"><strong>Erro ao carregar dados</strong>Verifique sua conexão e recarregue a página.</div>
      </div></div>`;
  }
}

init();
</script>
